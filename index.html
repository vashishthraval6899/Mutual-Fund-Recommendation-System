<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InvestWise | Mutual Fund Recommender</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <div class="container">
        <header>
            <div class="brand">
                <h1>Invest<span class="highlight">Wise</span></h1>
                <p>AI-Powered Mutual Fund Recommendation System</p>
                <small>By Vashishth Raval</small>
            </div>
        </header>

        <main>
            <section class="control-panel">
                <!-- ================== AI RISK PROFILING (NEW) ================== -->
                <div class="input-group">
                    <label>Age</label>
                    <input type="number" id="age" placeholder="e.g. 28">
                </div>
                
                <div class="input-group">
                    <label>Investment Horizon (Years)</label>
                    <input type="number" id="horizon" placeholder="e.g. 10">
                </div>
                
                <div class="input-group">
                    <label>Risk Tolerance</label>
                    <select id="risk_tolerance">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
                
                <div class="input-group">
                    <label>Emergency Fund</label>
                    <select id="emergency_fund">
                        <option value="yes">Yes</option>
                        <option value="no">No</option>
                    </select>
                </div>
                
                <div class="input-group">
                    <label>Market Experience</label>
                    <select id="market_exp">
                        <option value="beginner">Beginner</option>
                        <option value="intermediate" selected>Intermediate</option>
                        <option value="advanced">Advanced</option>
                    </select>
                </div>
                <!-- ================== END AI RISK PROFILING ================== -->

                <div class="input-group">
                    <label for="clusterSelect">Investment Strategy Profile</label>
                    <div class="select-wrapper">
                        <select id="clusterSelect">
                            <option value="1" selected>🟦 Very Low Risk 💧 High Liquidity 📉 Low Returns 💤 Overnight Funds</option>
                            <option value="2">🟧 High Risk 🔄 Volatile Returns 🌍 Global Exposure 🪙 Gold & Thematic Funds</option>
                            <option value="0">🟩 Medium–High Risk 📈 High Growth 🇮🇳 Equity Focus 🔗 Multi-Asset Diversification</option>
                            </select>
                    </div>
                </div>
                <<button onclick="getAIRecommendation()" class="primary-btn">AI Recommend 🚀</button>
            </section>

            <div id="dashboard" class="dashboard hidden">
                
                <section class="card table-card">
                    <div class="card-header">
                        <h2>Top Performing Funds</h2>
                    </div>
                    <div id="fundTable" class="table-responsive"></div>
                </section>

                <section class="charts-stack">
                    <div class="card chart-card">
                        <h3>Top 10 Funds: Return Trajectory (1Y - 3Y)</h3>
                        <div class="chart-container-lg">
                            <canvas id="returnChart"></canvas>
                        </div>
                    </div>
                    <div class="card chart-card">
                        <h3>Top 10 Funds: Risk Analysis (Standard Deviation)</h3>
                        <div class="chart-container-lg">
                            <canvas id="stdChart"></canvas>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
