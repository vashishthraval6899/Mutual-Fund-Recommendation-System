<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mutual Fund Recommender</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
  <h2>Tell us about yourself</h2>

  <label>Age</label>
  <input type="number" id="age" value="30">

  <label>Risk Appetite (1–10)</label>
  <input type="number" id="risk_score" value="7">

  <label>Investment Horizon (years)</label>
  <input type="number" id="investment_horizon" value="8">

  <label>Liquidity Need (1–10)</label>
  <input type="number" id="liquidity_need" value="3">

  <label>Expected Return (%)</label>
  <input type="number" id="expected_return" value="15">

  <label>Income Stability (1–5)</label>
  <input type="number" id="income_stability" value="4">

  <br><br>

  <button onclick="submitForm()">
    Get Recommendation
  </button>
  
  <div id="result-card" class="card hidden">
  <div class="card-header">
    <h2>Recommendation Result</h2>
  </div>

  <div class="card-body" style="padding:20px;">
    <p id="cluster-name" style="font-size:20px; font-weight:700;"></p>
    <p id="confidence-text"></p>

    <div style="margin-top:15px;">
      <div style="height:10px; background:#e5e7eb; border-radius:6px;">
        <div id="confidence-bar"
             style="height:10px; width:0%; background:#2563eb; border-radius:6px;">
        </div>
      </div>
    </div>
  </div>
</div>

</div>


  <!-- 🔴 THIS LINE IS THE FIX -->
  <script src="script.js"></script>

</body>
</html>
